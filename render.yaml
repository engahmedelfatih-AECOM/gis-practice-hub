# Render Blueprint for the GIS Hub demonstration (web service + Postgres), separate from the
# Resource Planner service and database.
services:
  - type: web
    name: gis-practice-hub
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gis-practice-hub-db
          property: connectionString
      - key: APP_URL
        value: https://gis-practice-hub.onrender.com
      - key: BETTER_AUTH_URL
        value: https://gis-practice-hub.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: JOB_TOKEN
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_NAME
        value: Administrator
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ACCOUNTS_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
databases:
  - name: gis-practice-hub-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
