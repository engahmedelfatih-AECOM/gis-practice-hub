name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gh_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/gh_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/gh_test
      APP_URL: http://127.0.0.1:3100
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run test:int
      - run: npx playwright install --with-deps chromium
      # End-to-end tests get their own database so integration fixtures can never leak into them.
      - name: Create end-to-end database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE gh_e2e"
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/gh_e2e
      - run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/gh_e2e
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_NAME: CI Administrator
          SEED_ADMIN_PASSWORD: Ci-Only-Password-123!
      # The role walk-throughs run on the sample workbook with one account per role.
      - name: Load the sample workbook
        run: npx tsx scripts/import-sample.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/gh_e2e
      - name: Create the role accounts
        run: npx tsx scripts/demo-accounts.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/gh_e2e
          DEMO_ACCOUNTS_PASSWORD: Ci-Only-Demo-Password-123!
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/gh_e2e
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: Ci-Only-Password-123!
          E2E_DEMO_PASSWORD: Ci-Only-Demo-Password-123!
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: resource-planner:ci
